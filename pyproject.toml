# MySQL Console - 打包元数据(PEP 621 / setuptools)
# 开发仓库/发布包以「src/ 平铺源码 + 根 requirements.txt」形态交付;
# 本文件额外提供 pip 安装路径: `pip install .` 后可用 `mysql-console` 命令启动。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mysql-console"
version = "3.8.1"
description = "MySQL Console - 本地 MySQL 数据库可视化管理平台(Web 控制台): 备份/还原、定时备份、用户与权限、系统监控、登录认证。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mysql-console contributors" }]
keywords = ["mysql", "database", "console", "web", "backup", "admin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "pymysql>=1.1,<2",
    "cryptography>=42",
]

[project.scripts]
mysql-console = "server:main"

# src/ 平铺布局:模块直接装入 site-packages 顶层(与源码树导入方式一致,零改动)。
[tool.setuptools]
py-modules = [
    "backup_engine", "cli_backup", "cli_init", "config_store",
    "env_probe", "handlers", "local_store", "metrics", "mysql_client",
    "native_scheduler", "paths", "routes", "schedule_store", "security",
    "server", "service_manager", "sys_resources", "system_db", "tools_downloader",
    "updater", "variable_docs", "version",
]
package-dir = { "" = "src" }

# 前端静态资源以数据文件安装到 <sys.prefix>/share/mysql-console/static(paths.static_dir 兜底读取)。
[tool.setuptools.data-files]
"share/mysql-console/static" = [
    "src/static/index.html",
    "src/static/app.js",
    "src/static/dashboard-helpers.js",
    "src/static/style.css",
    "src/static/login.html",
    "src/static/echarts.min.js",
]

# ---------------- Ruff 静态检查(CI 门禁,只查不改) ----------------
# 2026-09-10 引入(PLAN_HARDENING 5.1)。规则集刻意保守:pyflakes 全量(F:未定义名/未用导入/
# 未用变量)+ pycodestyle 错误子集(E4/E7/E9),不启用风格类规则(引号/缩进/行长)——
# 目标是抓真 bug(未定义名、遮蔽、f-string 错误),不做风格统一。基线 3.10。
[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".venv", "node_modules", "runtime", "dist", "data", "tools", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# E701/E702(单行复合语句)/E401(逗号导入)为本仓库既有风格,存量多且非缺陷,不做风格统一。
ignore = ["E701", "E702", "E401"]

[tool.ruff.lint.per-file-ignores]
# 测试:sys.path 引导后导入(E402)与副作用导入(F401,如 import native_script 触发模块初始化)均为刻意写法
"tests/*" = ["E402", "F401"]
# server.py:嵌入式运行时需先 sys.path.insert 再 import(刻意引导,见文件头注释)
"src/server.py" = ["E402"]