# MySQL Console CI(2026-08-28 新增; 2026-xx 目录结构化后同步路径: 代码在 src/, 测试分型)
# 三级流水线:
#   backend  —— Python 3.10/3.11/3.12: py_compile + API 层回归(隔离数据目录) + 离线单测(纯逻辑/mock,无需 MySQL)
#   frontend —— Node 20: npm ci + jsdom 回归(依赖固化于 package.json)
#   e2e      —— MySQL 8 服务容器 + MySQL 8 客户端: 备份→还原闭环 + 异步进度(真实链路)
# 说明: data/、.venv、node_modules 均不入库,用干净 checkout;测试数据目录经 MC_DATA_DIR 隔离。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端(py_compile + API 回归 + 离线单测)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 全模块编译(冒烟)
        run: python -m compileall -q src tests/api tests/unit tests/e2e
      - name: API 层回归(隔离数据目录,无 MySQL 也可跑)
        run: python tests/api/test_api.py
      - name: 离线单元测试
        run: python tests/unit/test_units.py
      - name: 运行时解析单测(纯标准库,无需 pymysql)
        run: |
          python tests/unit/test_runtime_resolver.py
          python tests/unit/test_pip_bootstrap.py
          python tests/unit/test_native_script.py
      - name: 4包构建校验(slim/standard × win64/linux，桩 tools 避免真下载)
        run: |
          mkdir -p /tmp/fake-tools-linux/mysql-5.7 /tmp/fake-tools-linux/mysql-8.0
          printf "fake" > /tmp/fake-tools-linux/mysql-5.7/mysqldump
          printf "fake" > /tmp/fake-tools-linux/mysql-5.7/mysql
          printf "fake" > /tmp/fake-tools-linux/mysql-8.0/mysqldump
          printf "fake" > /tmp/fake-tools-linux/mysql-8.0/mysql
          python scripts/build_release.py --platform linux --variant slim --tag v3.8.1
          python scripts/build_release.py --platform win64 --variant slim --tag v3.8.1
          python scripts/build_release.py --platform linux --variant standard --tools-dir /tmp/fake-tools-linux --tag v3.8.1
          ls -lh dist/*.zip dist/*.tar.gz 2>/dev/null || true
          # standard 需含 tools，桩目录校验通过即算构建链路覆盖
          ls -lh dist/*.zip dist/*.tar.gz 2>/dev/null || true

  crossplatform:
    name: 跨平台冒烟(Windows / macOS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 全模块编译(冒烟)
        # 跨平台兼容：glob 在 Windows PowerShell 下不展开导致 [Errno 22] Invalid argument，故改用 compileall 目录遍历
        run: python -m compileall -q src tests/api tests/unit
      - name: API 层回归(隔离数据目录, 无 MySQL 也可跑)
        run: python tests/api/test_api.py
      - name: 离线单元测试 + 原生计划任务脚本单测
        run: |
          python tests/unit/test_units.py
          python tests/unit/test_native_script.py
      # 真机启动冒烟:Windows/macOS 上真实拉起服务并健康检查(覆盖跨平台启动路径/对话框分支加载)
      - name: 启动服务冒烟 + 健康检查
        shell: bash
        run: |
          export MC_DATA_DIR="$RUNNER_TEMP/mc_smoke"
          python src/server.py > "$RUNNER_TEMP/mc_server.log" 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null" EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/api/health > /dev/null && break
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8090/api/health; then
            echo "服务未在 30s 内就绪, server.log:"; cat "$RUNNER_TEMP/mc_server.log"; exit 1
          fi
          echo "健康检查 OK（${{ matrix.os }}）"
          kill $SERVER_PID 2>/dev/null || true

  frontend:
    name: 前端(jsdom 回归)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装 jsdom(devDependencies 固化)
        run: npm ci
      - name: 前端回归(jsdom 测试)
        run: npm test

  e2e:
    name: E2E(备份→还原闭环, MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      MC_DATA_DIR: /tmp/mc_ci_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 安装 MySQL 8 客户端(CAP 的 --set-gtid-purged 需 MySQL 8 的 mysqldump,MariaDB 客户端不支持)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client-8.0
          mysqldump --version | head -1
      - name: 准备隔离数据目录并激活 CI 连接
        run: |
          mkdir -p "$MC_DATA_DIR"
          python - <<'EOF'
          import sys
          sys.path.insert(0, "src")   # 目录结构化:代码在 src/
          import config_store
          config_store.prepare_lite()
          cid = config_store.save_connection({
              "name": "ci", "host": "127.0.0.1", "port": 3306,
              "user": "root", "password": "root"})
          config_store.set_active_conn_id(cid)
          print("prepared cid:", cid)
          EOF
      - name: 启动服务并跑 E2E 闭环(同一 step,防后台进程被 step 结束杀掉)
        run: |
          python src/server.py > /tmp/mc_server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null" EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/api/health > /dev/null && break
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8090/api/health; then
            echo "服务未在 30s 内就绪, server.log:"; tail -50 /tmp/mc_server.log; exit 1
          fi
          python tests/e2e/test_e2e.py
          python tests/e2e/test_progress.py

  systemd:
    name: systemd 服务化(真实 Linux 容器全链路验证)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 在 systemd 容器内验证(渲染→注册→启动→健康→重启→卸载)
        run: |
          docker run -d --name mc-sd \
            --privileged \
            --cgroupns=host \
            --tmpfs /tmp \
            --tmpfs /run \
            --tmpfs /run/lock \
            -v "$PWD":/repo \
            ghcr.io/zuptalo/docker-ubuntu-systemd:latest
          # 等容器内 systemd 总线就绪;容器意外退出则打印日志定位(cgroup v2 环境关键)
          for i in $(seq 1 90); do
            docker exec mc-sd test -S /run/systemd/private 2>/dev/null && break
            docker inspect -f '{{.State.Running}}' mc-sd 2>/dev/null | grep -q "true" \
              || { echo "容器提前退出,日志:"; docker logs mc-sd 2>&1 | tail -40; exit 1; }
            sleep 1
          done
          docker exec mc-sd bash -c '
            set -e
            mkdir -p /app
            cp -a /repo/. /app/         # 复制仓库内容(含隐藏文件)到独立目录,避免 .venv 污染宿主
            cd /app
            [ -f /app/src/server.py ] || { echo "复制失败, /app 内容:"; ls -la /app | head -20; exit 1; }
            apt-get update -qq
            apt-get install -y -qq python3-venv python3-pip curl

            echo "== 1) 审查渲染后的 unit(占位符必须被真实路径/用户替换) =="
            ./platforms/linux/scripts/install.sh --print-service | tee /tmp/unit.txt
            grep -Fq "WorkingDirectory=/app" /tmp/unit.txt
            grep -Fq "ExecStart=/app/.venv/bin/python /app/src/server.py" /tmp/unit.txt
            grep -Fq "User=" /tmp/unit.txt

            echo "== 2) 注册并启动 =="
            ./platforms/linux/scripts/install.sh --service
            sleep 2
            systemctl is-active mysql-console
            systemctl is-enabled mysql-console

            echo "== 3) 健康检查 /api/health =="
            for i in $(seq 1 15); do
              curl -sf http://127.0.0.1:8090/api/health >/dev/null && break
              sleep 1
            done
            curl -sf http://127.0.0.1:8090/api/health

            echo "== 4) 服务日志 =="
            journalctl -u mysql-console --no-pager -n 10 | tail -3

            echo "== 5) 重启后再验(Restart=on-failure 配置生效) =="
            systemctl restart mysql-console
            sleep 2
            systemctl is-active mysql-console
            curl -sf http://127.0.0.1:8090/api/health >/dev/null

            echo "== 6) 卸载 =="
            ./platforms/linux/scripts/install.sh --remove-service
            if systemctl is-enabled mysql-console >/dev/null 2>&1; then
              echo "FAIL: 服务卸载后仍为 enabled"; exit 1
            fi
            [ ! -f /etc/systemd/system/mysql-console.service ] || { echo "FAIL: unit 文件残留"; exit 1; }
            echo "SYSTEMD-VERIFY-OK"
          '
          docker rm -f mc-sd >/dev/null 2>&1 || true